name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run basic functionality tests
      run: |
        python -m pytest test_agents.py::test_basic_functionality -v
    
    - name: Run syntax and import tests
      run: |
        python -c "import main; print('✅ Main module imports successfully')"
        python -c "from main import AgentSystem; print('✅ AgentSystem class available')"
    
    - name: Validate project structure
      run: |
        test -f main.py || exit 1
        test -f requirements.txt || exit 1
        test -f README.md || exit 1
        echo "✅ All required files present"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.12
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: Run flake8
      run: |
        flake8 main.py --max-line-length=120 --ignore=E203,W503
      continue-on-error: true
    
    - name: Check code formatting with black
      run: |
        black --check main.py --line-length=120
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' || github.event_name == 'release'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.12
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build setuptools wheel
    
    - name: Create package structure
      run: |
        mkdir -p dist
        cp main.py dist/
        cp requirements.txt dist/
        cp README.md dist/
        echo "✅ Package structure created"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ai-agent-system-${{ github.sha }}
        path: dist/
        retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'release'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: ai-agent-system-${{ github.sha }}
        path: dist/
    
    - name: Create release package
      run: |
        cd dist
        tar -czf ../ai-agent-system-release.tar.gz *
        echo "✅ Release package created"
    
    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./ai-agent-system-release.tar.gz
        asset_name: ai-agent-system-release.tar.gz
        asset_content_type: application/gzip
